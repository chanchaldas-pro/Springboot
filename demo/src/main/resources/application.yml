spring:
  application:
    name: demo

  datasource:
    url: ${DB_URL}
    username:  ${DB_USERNAME}
    password:  ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    debug: true

server:
  port: 8081

logging:
  level:
    org.springframework.security: DEBUG


resilience4j:
  circuitbreaker:
    instances:
      paymentGateway:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        sliding-window-size: 10

  retry:
    instances:
      paymentGateway:
        max-attempts: 3
        wait-duration: 1s

razorpay:
  key:
    id: ${RAZORPAY_KEY}
    secret: ${RAZORPAY_SECRET}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET}



#Property	What it does
#ddl-auto=update	Auto-create/update tables based on Entities
#show-sql=true	Show SQL queries in console
#hibernate.dialect=PostgreSQLDialect	Use PostgreSQL SQL syntax





